name: Cartelera

on:
  schedule:
    - cron: "*/5 * * * *"   # cada 5 minutos
    - cron: "17 3 1 * *"    # el día 1 de cada mes: mantiene vivo el repositorio
  workflow_dispatch:         # botón para correrlo a mano

concurrency:
  group: cartelera
  cancel-in-progress: false

jobs:
  revisar:
    if: github.event.schedule != '17 3 1 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python finalmente_bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

  # GitHub apaga las tareas programadas de un repositorio que pasa 60 días sin cambios,
  # y en enero y febrero la cartelera no publica nada. Un cambio por mes lo evita.
  mantener-vivo:
    if: github.event.schedule == '17 3 1 * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .ultima-actividad
          git add .ultima-actividad
          git commit -m "Mantener activas las tareas programadas"
          git push

